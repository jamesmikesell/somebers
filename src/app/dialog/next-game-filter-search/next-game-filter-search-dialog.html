<h2 mat-dialog-title>Searching for a game</h2>

<div mat-dialog-content class="content">
  <div class="row">
    <mat-progress-spinner mode="indeterminate" diameter="32"></mat-progress-spinner>
    <div class="text">
      Looking for a board that matches your filter. If nothing turns up, you can cancel or disable the Game Filter from the menu.
      <div class="current">
        Checking game #
        <span class="current__number">{{ currentGameNumber ?? "..." }}</span>
      </div>
    </div>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel search</button>
</div>
