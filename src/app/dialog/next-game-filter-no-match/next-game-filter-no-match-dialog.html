<h2 mat-dialog-title>No game matches the filter</h2>

<div mat-dialog-content class="content">
  <p>
    No boards were found that match your current Game Filter. Adjust the filter or disable it to resume normal next-game navigation.
  </p>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="disableFilter()">Disable filter</button>
  <button mat-flat-button color="primary" type="button" (click)="close()">OK</button>
</div>
